<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart Ration — Tamil Nadu ePDS Digital Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #12304a;
  --blue: #1769aa;
  --teal: #008b8b;
  --green: #18864b;
  --orange: #d97706;
  --red: #c62828;
  --purple: #7048b8;
  --bg: #f4f7fa;
  --card: #fff;
  --text: #17212b;
  --muted: #667585;
  --border: #dfe6ec;
  --shadow: 0 8px 24px rgba(18,48,74,.08);
  --radius: 16px;
  --tn-green: #0a6638;
  --tn-maroon: #821414;
  --tn-gold: #e5a93c;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; border: 0; }
.hidden { display: none !important; }

/* Layout & Topbar */
.app { min-height: 100vh; }
.landing { min-height: 100vh; }
.topbar {
  height: 72px;
  background: #fff;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6%;
  position: sticky;
  top: 0;
  z-index: 20;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 21px;
  font-weight: 800;
  color: var(--navy);
  text-decoration: none;
}
.brandmark {
  width: 40px;
  height: 40px;
  border-radius: 11px;
  background: var(--navy);
  color: white;
  display: grid;
  place-items: center;
  font-size: 16px;
  font-weight: 900;
}
.brand-tn {
  display: flex;
  flex-direction: column;
}
.brand-tn small {
  font-size: 11px;
  font-weight: 600;
  color: var(--tn-green);
  letter-spacing: 0.5px;
}
.nav { display: flex; gap: 26px; }
.nav a { color: #425466; text-decoration: none; font-size: 14px; font-weight: 600; }
.nav a:hover { color: var(--blue); }

/* Buttons */
.btn {
  padding: 11px 18px;
  border-radius: 10px;
  font-weight: 700;
  transition: all .2s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
}
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: #10598f; transform: translateY(-1px); }
.btn-outline { background: #fff; border: 1px solid var(--border); color: var(--navy); }
.btn-outline:hover { background: #f8fafc; border-color: #cbd5e1; }
.btn-success { background: var(--green); color: #fff; }
.btn-success:hover { background: #136f3e; }
.btn-warning { background: var(--orange); color: #fff; }
.btn-danger { background: var(--red); color: #fff; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }

/* Hero Section */
.hero {
  padding: 76px 6%;
  display: grid;
  grid-template-columns: 1.1fr .9fr;
  gap: 60px;
  align-items: center;
  background: linear-gradient(180deg, #fff, #f3f8fb);
}
.eyebrow {
  color: var(--teal);
  font-weight: 800;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.hero h1 { font-size: 50px; line-height: 1.1; margin: 14px 0; color: var(--navy); }
.hero p { font-size: 18px; line-height: 1.7; color: var(--muted); max-width: 650px; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }

/* Hero Mini Demo */
.hero-demo {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 24px;
  box-shadow: var(--shadow);
}
.mini-head { display: flex; justify-content: space-between; align-items: center; }
.mini-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 18px; }
.mini-card { padding: 16px; border: 1px solid var(--border); border-radius: 14px; background: #fafbfc; }
.mini-value { font-size: 24px; font-weight: 800; color: var(--navy); margin-top: 6px; }

/* General Sections */
.section { padding: 70px 6%; }
.section h2 { text-align: center; color: var(--navy); font-size: 30px; margin-bottom: 30px; }
.feature-grid, .portal-grid, .product-grid, .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.feature-card, .portal-card, .card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
}
.feature-card h3, .portal-card h3 { margin: 14px 0 8px; color: var(--navy); }
.feature-card p, .portal-card p { color: var(--muted); line-height: 1.6; font-size: 14px; }
.icon {
  width: 46px;
  height: 46px;
  border-radius: 12px;
  background: #e9f3fb;
  display: grid;
  place-items: center;
  font-size: 22px;
}
footer { padding: 32px 6%; background: var(--navy); color: #dce8f0; text-align: center; font-size: 13px; line-height: 1.8; }

/* Modals */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(12, 28, 42, .6);
  display: grid;
  place-items: center;
  z-index: 100;
  padding: 20px;
  backdrop-filter: blur(4px);
}
.modal {
  background: #fff;
  border-radius: 20px;
  max-width: 580px;
  width: 100%;
  padding: 30px;
  box-shadow: 0 25px 70px rgba(0,0,0,.25);
  animation: slide .25s ease-out;
}
.modal h2 { margin-top: 0; color: var(--navy); font-size: 24px; }
.close {
  float: right;
  background: #eef2f5;
  border-radius: 50%;
  width: 34px;
  height: 34px;
  font-size: 16px;
  font-weight: 700;
  display: grid;
  place-items: center;
}
.close:hover { background: #e2e8f0; }
.lang-options, .portal-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 20px; }
.portal-options { grid-template-columns: repeat(3, 1fr); }
.choice {
  border: 1px solid var(--border);
  background: #fff;
  padding: 20px;
  border-radius: 14px;
  text-align: left;
  transition: all .2s;
}
.choice:hover { border-color: var(--blue); background: #f6fbff; transform: translateY(-2px); }

/* Portal & Forms */
.portal { min-height: 100vh; padding: 60px 6%; background: #f5f8fb; }
.portal-title { text-align: center; margin-bottom: 35px; }
.portal-title h1 { color: var(--navy); font-size: 32px; }

.login-box {
  max-width: 520px;
  margin: 20px auto;
  background: #fff;
  padding: 32px;
  border-radius: 20px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  position: relative;
}
.login-stripe {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 5px;
  border-radius: 20px 20px 0 0;
  background: linear-gradient(90deg, var(--tn-maroon) 0%, var(--tn-green) 50%, var(--tn-gold) 100%);
}
label { font-size: 13px; font-weight: 700; color: #455564; display: block; margin: 16px 0 7px; text-align: left; }
input, select, textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #ccd6de;
  border-radius: 10px;
  outline: none;
  background: #fff;
  transition: border-color .2s;
}
input:focus, select:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.12); }
.input-prefix-box {
  display: flex;
  align-items: center;
  background: #fff;
  border: 1px solid #ccd6de;
  border-radius: 10px;
  overflow: hidden;
}
.input-prefix-box:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(23, 105, 170, 0.12); }
.input-prefix-box span {
  padding: 12px 14px;
  background: #f8fafc;
  color: #64748b;
  font-weight: 700;
  font-size: 13px;
  border-right: 1px solid #ccd6de;
  user-select: none;
}
.input-prefix-box input { border: 0; box-shadow: none; border-radius: 0; }

.demo-note {
  background: #fff8e8;
  border: 1px solid #f2d59a;
  padding: 12px;
  border-radius: 10px;
  font-size: 13px;
  color: #76520c;
  margin-top: 15px;
  text-align: left;
}
.topic-info-box {
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  border-radius: 10px;
  padding: 12px 14px;
  margin-top: 16px;
  font-size: 12px;
  color: #166534;
  text-align: left;
  line-height: 1.5;
}
.topic-info-box code {
  background: #dcfce7;
  padding: 2px 6px;
  border-radius: 4px;
  font-weight: 700;
  color: #14532d;
}

/* Portal App Shell */
.portal-layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
.sidebar { background: var(--navy); color: #fff; padding: 22px 16px; position: sticky; top: 0; height: 100vh; }
.side-brand { padding: 10px 12px 25px; font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.side-nav button {
  width: 100%;
  text-align: left;
  background: transparent;
  color: #d8e4ec;
  padding: 12px 14px;
  border-radius: 10px;
  margin: 3px 0;
  font-weight: 600;
  font-size: 14px;
  transition: all .15s;
}
.side-nav button:hover, .side-nav button.active { background: rgba(255,255,255,0.12); color: #fff; }
.content { padding: 32px; overflow: auto; }
.content-head { display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 25px; }
.content-head h1 { margin: 0; color: var(--navy); font-size: 28px; }
.user-tools { display: flex; align-items: center; gap: 12px; }
.avatar {
  width: 40px;
  height: 40px;
  background: #dcecf7;
  color: var(--navy);
  display: grid;
  place-items: center;
  border-radius: 50%;
  font-weight: 800;
  font-size: 14px;
}

/* Stat Cards & Dashboard */
.stat-grid { grid-template-columns: repeat(4, 1fr); }
.stat-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  box-shadow: var(--shadow);
}
.stat-card .label { color: var(--muted); font-size: 13px; font-weight: 600; }
.stat-card .num { font-size: 28px; font-weight: 850; color: var(--navy); margin-top: 8px; }
.stat-card .sub { font-size: 12px; margin-top: 6px; color: var(--green); font-weight: 600; }

.two-col { display: grid; grid-template-columns: 1.3fr .7fr; gap: 18px; margin-top: 18px; }
.card h2, .card h3 { color: var(--navy); margin-top: 0; }
.progress { height: 12px; background: #e7edf1; border-radius: 20px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--teal); border-radius: 20px; }
.progress-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin: 8px 0; font-weight: 600; }

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 30px;
  padding: 5px 11px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.3px;
}
.available, .prepared, .collected { background: #e8f7ee; color: var(--green); }
.warning, .pending { background: #fff3df; color: #9b5c00; }
.out, .missed { background: #fdeaea; color: var(--red); }
.booked { background: #e9f1fb; color: var(--blue); }
.purple { background: #f1ebfb; color: var(--purple); }

/* Products Grid */
.product-grid { grid-template-columns: repeat(4, 1fr); }
.product-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
}
.product-icon { height: 95px; border-radius: 12px; background: #edf5f7; display: grid; place-items: center; font-size: 45px; }
.product-card h3 { margin: 12px 0 5px; font-size: 18px; }
.muted { color: var(--muted); font-size: 13px; }
.qty { display: flex; gap: 8px; align-items: center; margin: 14px 0; }
.qty button { width: 32px; height: 32px; border-radius: 8px; background: #eef2f5; font-weight: 800; font-size: 16px; }
.qty button:hover { background: #e2e8f0; }
.qty span { min-width: 32px; text-align: center; font-weight: 800; font-size: 15px; }

/* Tables */
.table-wrap { overflow: auto; }
.table { width: 100%; border-collapse: collapse; min-width: 760px; }
.table th, .table td { text-align: left; padding: 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
.table th { background: #f7f9fb; color: #526373; font-weight: 700; }
.table tr:hover td { background: #fafcfd; }

/* Slots & Charts */
.slot-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.slot {
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  background: #fff;
  text-align: left;
  transition: all .2s;
}
.slot:hover, .slot.selected { border: 2px solid var(--blue); background: #f5fbff; }
.slot strong { display: block; color: var(--navy); margin-bottom: 8px; font-size: 15px; }
.slot .capacity { font-size: 12px; color: var(--muted); font-weight: 600; }
.chart { height: 210px; display: flex; align-items: end; gap: 15px; padding: 20px 10px 10px; border-top: 1px solid var(--border); }
.bar { flex: 1; background: #75a9c9; border-radius: 6px 6px 0 0; position: relative; min-height: 10px; }
.bar span { position: absolute; top: -20px; font-size: 11px; left: 50%; transform: translateX(-50%); font-weight: 700; color: var(--navy); }
.bar small { position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%); white-space: nowrap; color: var(--muted); font-size: 10px; }

/* Timeline */
.timeline { display: flex; align-items: center; gap: 0; overflow: auto; padding: 20px 0; }
.step { min-width: 115px; text-align: center; position: relative; }
.step:not(:last-child):after { content: ""; height: 3px; background: #dce4ea; width: 100%; position: absolute; top: 18px; left: 50%; z-index: 0; }
.dot {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #e7edf1;
  margin: auto;
  position: relative;
  z-index: 1;
  font-weight: 800;
  color: #607180;
}
.step.done .dot { background: #dff4e8; color: var(--green); }
.step.current .dot { background: #dcecf9; color: var(--blue); box-shadow: 0 0 0 5px rgba(220,236,249,.5); }
.step p { font-size: 11px; color: var(--muted); margin-top: 8px; font-weight: 600; }

/* System Flow */
.flow { display: grid; gap: 8px; max-width: 680px; margin: auto; }
.flow-item { padding: 14px; background: #fff; border: 1px solid var(--border); border-radius: 11px; text-align: center; font-weight: 700; color: var(--navy); }
.arrow { text-align: center; color: var(--teal); font-size: 20px; }

/* Toast */
.toast {
  position: fixed;
  right: 24px;
  bottom: 24px;
  background: var(--navy);
  color: #fff;
  padding: 15px 20px;
  border-radius: 12px;
  box-shadow: 0 12px 40px rgba(0,0,0,.25);
  z-index: 200;
  animation: slide .25s ease-out;
  font-weight: 600;
  font-size: 14px;
}
.mobile-menu { display: none; }
@keyframes slide { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Notices & Rules */
.notice { padding: 14px 16px; border-radius: 11px; background: #edf7fb; border-left: 4px solid var(--teal); font-size: 13px; margin: 14px 0; line-height: 1.5; }
.rule { background: #faf7ff; border: 1px solid #e4d9f5; border-radius: 12px; padding: 16px; }
.empty { padding: 40px; text-align: center; color: var(--muted); font-size: 15px; }

/* Smart Card Graphic */
.ration-card-ui {
  background: linear-gradient(135deg, #0a4f2c 0%, #0d6e3e 100%);
  color: white;
  border-radius: 18px;
  padding: 24px;
  box-shadow: 0 15px 35px rgba(10,79,44,0.25);
  position: relative;
  overflow: hidden;
  margin-bottom: 22px;
}
.ration-card-ui::after {
  content: "🏛️";
  position: absolute;
  right: -10px;
  bottom: -20px;
  font-size: 130px;
  opacity: 0.12;
  pointer-events: none;
}
.card-header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.2);
  padding-bottom: 12px;
  margin-bottom: 16px;
}
.card-quota-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  background: rgba(255,255,255,0.1);
  padding: 12px;
  border-radius: 10px;
  margin-top: 16px;
  text-align: center;
}
.card-quota-item b { display: block; font-size: 16px; margin-top: 4px; }

/* Responsive */
@media(max-width: 1050px) {
  .hero { grid-template-columns: 1fr; }
  .product-grid { grid-template-columns: repeat(2, 1fr); }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
  .slot-grid { grid-template-columns: repeat(2, 1fr); }
  .two-col { grid-template-columns: 1fr; }
}
@media(max-width: 760px) {
  .nav { display: none; }
  .topbar { padding: 0 18px; }
  .hero { padding: 50px 20px; }
  .hero h1 { font-size: 38px; }
  .section { padding: 50px 20px; }
  .feature-grid, .portal-grid, .product-grid { grid-template-columns: 1fr; }
  .portal-layout { grid-template-columns: 1fr; }
  .sidebar { height: auto; position: fixed; left: -270px; width: 250px; z-index: 80; transition: .25s; }
  .sidebar.open { left: 0; }
  .content { padding: 18px; }
  .mobile-menu { display: block; background: #eef3f7; border-radius: 8px; padding: 9px 12px; }
  .stat-grid { grid-template-columns: 1fr 1fr; }
  .slot-grid { grid-template-columns: 1fr; }
  .portal-options { grid-template-columns: 1fr; }
  .lang-options { grid-template-columns: 1fr; }
  .two-col { grid-template-columns: 1fr; }
}
</style>
</head>

function save() {

function toast(msg) {
  const x = document.createElement("div");
  x.className = "toast";
  x.textContent = msg;
  document.getElementById("toastRoot").appendChild(x);
  setTimeout(() => x.remove(), 3200);
  save();
}

function modal(html) {
  document.getElementById("modalRoot").innerHTML =
    `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}

function closeModal() {
  document.getElementById("modalRoot").innerHTML = "";
}

function audit(action, product = "-", status = "Completed") {
  const citizenName = state.citizen ? state.citizen.full_name : "Beneficiary";
  state.audit.unshift({
    time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }),
    user: state.role === "staff" ? "Staff-102" : citizenName,
    role: state.role || "Citizen",
    action,
    product,
    shop: state.citizen ? (state.citizen.fps_shop_code || "FPS-1024") : "FPS-1024",
    status
  });
  save();
}

// Fetch live citizen directory from backend
async function fetchCitizensFromBackend() {
  try {
    const res = await fetch(`${API_URL}/citizens`);
    if (res.ok) {
      const data = await res.json();
      if (data.citizens && Array.isArray(data.citizens)) {
        state.citizensList = data.citizens;
        // Keep selected mobile synced
        const found = state.citizensList.find(c => c.mobile_number === state.selectedMobile);
        if (found) {
          state.selectedCardNo = found.smart_card_no;
        }
        if (state.page === "login") render();
      }
    }
  } catch (e) {
    console.log("Using cached/fallback citizen list.");
  }
}

// Request OTP from Backend API
async function requestOtpFromBackend() {
  const mobileInput = document.getElementById('mobile');
  const mobile = mobileInput ? mobileInput.value.trim() : state.selectedMobile;

  if (!mobile || mobile.length !== 10) {
    toast("⚠️ Please enter a valid 10-digit mobile number.");
    if (mobileInput) mobileInput.focus();
    return;
  }

  state.isSendingOtp = true;
  render();

  try {
    const res = await fetch(`${API_URL}/request-otp`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mobile_number: mobile })
    });

    const data = await res.json();

    if (res.ok) {
      state.otpSent = true;
      state.devOtp = data.devOtp || null;
      toast(`📲 OTP sent to your phone! Topic: ${data.topic || 'tnpds-' + mobile}`);

      // Start 30s countdown
      clearInterval(state.countdownInterval);
      state.countdown = 30;
      state.countdownInterval = setInterval(() => {
        state.countdown -= 1;
        if (state.countdown <= 0) {
          clearInterval(state.countdownInterval);
        }
        const timerSpan = document.getElementById('resendCountdownSpan');
        if (timerSpan) timerSpan.innerText = state.countdown;
      }, 1000);

    } else {
      toast(`❌ ${data.error || 'Failed to dispatch OTP.'}`);
    }
  } catch (err) {
    toast(`❌ Backend offline. Ensure server is running on http://localhost:3000`);
  } finally {
    state.isSendingOtp = false;
    render();
    setTimeout(() => {
      const otpField = document.getElementById('otp');
      if (otpField) otpField.focus();
    }, 100);
  }
}

// Verify OTP with Backend API
async function verifyOtpWithBackend() {
  const mobileInput = document.getElementById('mobile');
  const mobile = mobileInput ? mobileInput.value.trim() : state.selectedMobile;
  const otpInput = document.getElementById('otp');
  const otp = otpInput ? otpInput.value.trim() : '';

  if (!otp || otp.length !== 6) {
    toast("⚠️ Please enter the full 6-digit OTP.");
    if (otpInput) otpInput.focus();
    return;
  }

  state.isVerifyingOtp = true;
  render();

  try {
    const res = await fetch(`${API_URL}/verify-otp`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mobile_number: mobile, otp: otp })
    });

    const data = await res.json();

    if (res.ok) {
      state.verified = true;
      localStorage.setItem('tnpds_token', data.token);

      // Bind authenticated citizen details to state
      const c = data.citizen || state.citizensList.find(x => x.mobile_number === mobile) || {
        full_name: 'Registered Citizen',
        mobile_number: mobile,
        smart_card_no: state.selectedCardNo || '33/G/0123456',
        card_type: 'PHH (Rice)',
        district: 'Chennai',
        taluk: 'Mylapore',
        fps_shop_code: 'TN-FPS-0102',
        fps_shop_name: 'Mylapore TUCS Cooperative Society',
        rice_quota_kg: 20,
        sugar_quota_kg: 2,
        dhal_quota_kg: 1,
        oil_quota_liters: 1
      };

      state.citizen = c;
      state.location = c.fps_shop_code || "FPS-1024";

      // Dynamically update product entitlements based on card quota

// Register New Citizen via Backend API
async function submitNewCitizenRegistration() {
  const name = (document.getElementById('regName').value || '').trim();
  const mobile = (document.getElementById('regMobile').value || '').trim();
  const cardType = document.getElementById('regCardType').value;
  const district = (document.getElementById('regDistrict').value || 'Chennai').trim();

  if (!name || !mobile || mobile.length !== 10) {
    toast("⚠️ Please enter a valid name and 10-digit mobile number.");
    return;
  }

  try {
    const res = await fetch(`${API_URL}/register-citizen`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        full_name: name,
        mobile_number: mobile,
        card_type: cardType,
        district: district,
        taluk: 'Central',
        fps_shop_code: 'TN-FPS-0101'
      })
    });

    const data = await res.json();
    if (res.ok) {
      toast(`✅ Citizen ${name} registered successfully!`);
      state.showRegisterForm = false;
      state.selectedMobile = mobile;
      await fetchCitizensFromBackend();
      render();
    } else {
      toast(`❌ ${data.error || 'Registration failed.'}`);
    }
  } catch (e) {
    toast("❌ Server offline. Could not save citizen.");
  }
}

const quantities = {};
function changeQty(i, d) {
  quantities[i] = Math.max(0, Math.min(products[i].eligible, (quantities[i] || 0) + d));
  const el = document.getElementById("q" + i);
  if (el) el.textContent = quantities[i];
}

function addCart(i) {
  const p = products[i], q = quantities[i] || 0;
  if (!q) return toast("⚠️ Please select a quantity first");
  const found = state.cart.find(x => x.name === p.name);
  if (found) found.qty = Math.min(p.eligible, found.qty + q);
  else state.cart.push({ name: p.name, qty: q, eligible: p.eligible, status: "Ready" });
  quantities[i] = 0;
  const counter = document.getElementById("q" + i);
  if (counter) counter.textContent = "0";
  audit("Added to Ration Cart", p.name);
  toast(`✓ ${q} kg ${p.name} added to preparation cart`);
  render();
}

function applyStock() {
  let p = document.getElementById("restockProduct").value;
  let q = Number(document.getElementById("restockQty").value);
  state.stock[p] = (state.stock[p] || 0) + q;
  const prod = products.find(x => x.name === p);
  if (prod) {
    prod.stock = state.stock[p];
    prod.available = state.stock[p] > 0;
  }
  state.notifications.unshift({
    text: `${p} restocked (+${q} kg). Push notifications dispatched to waiting citizens.`,
    type: "Stock",
    time: "Now"
  });
  audit("Stock Inward", p);
  closeModal();
  toast(`✓ ${p} +${q} kg added to shop inventory`);
  render();
}

  const root = document.getElementById("app");
  const p = state.page;

  if (p === "landing") root.innerHTML = landing();

  else if (p === "card") root.innerHTML = cardView();

  else if (p === "flow") root.innerHTML = flowView();
  else if (p === "notifications") root.innerHTML = notificationsView();
  else if (p === "help") root.innerHTML = helpView();
  else if (p === "staff") root.innerHTML = staffDashboard();
  else if (p === "staffbookings") root.innerHTML = staffBookings();

  else if (p === "official") root.innerHTML = officialDashboard();
  else if (["shops", "stockofficial", "analytics", "slotdemand", "notifyofficial", "collections"].includes(p)) {
    const titles = {
      shops: "Fair Price Shops Overview",

      notifyofficial: "Restock Notification Funnel",

    };
    const bodies = {
      shops: `<div class="notice">128 registered Fair Price Shops across Chennai and suburban taluks.</div><div class="stat-grid"><div class="stat-card"><div class="label">Open Shops</div><div class="num">119</div></div><div class="stat-card"><div class="label">Stock Critical</div><div class="num">9</div></div></div>`,
      stockofficial: `<div class="notice">Central stock ledger synchronizing godown inward and counter sales.</div><div class="chart">${[72,58,81,43,67,52].map((v,i)=>`<div class="bar" style="height:${v}%"><span>${v}</span><small>FPS ${i+1}</small></div>`).join("")}</div>`,
      analytics: `<h3>Godown Inward → Outward → Shop Balance</h3><div class="stat-grid"><div class="stat-card"><div class="label">Inward</div><div class="num">500 MT</div></div><div class="stat-card"><div class="label">Distributed</div><div class="num">350 MT</div></div><div class="stat-card"><div class="label">Remaining</div><div class="num">150 MT</div></div></div>`,

      notifyofficial: `<h3>Restock Push Notification Funnel</h3><div class="timeline">${["Requests","Restocked","Pushed","Booked","Collected"].map((x,i)=>`<div class="step done"><div class="dot">${[421,302,278,210,185][i]}</div><p>${x}</p></div>`).join("")}</div>`,

    };
    root.innerHTML = officialSimple(titles[p], p, bodies[p]);
  }
  save();
}
